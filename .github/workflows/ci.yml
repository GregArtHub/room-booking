name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d booking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/booking_test?schema=public
      JWT_ACCESS_SECRET: ci-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install   # после первого коммита package-lock.json замените на npm ci
      - run: npx prisma generate
      - name: Линтер (ESLint)
        run: npm run lint
      - name: Форматтер (Prettier)
        run: npm run format:check
      - name: Unit-тесты и покрытие сервисного слоя
        run: npm run test:cov
      - name: Применение миграций к тестовой БД
        run: npx prisma migrate deploy
      - name: Интеграционные тесты API
        run: npm run test:e2e
      - name: Сборка
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install   # после первого коммита package-lock.json замените на npm ci
      - name: Линтер (ESLint)
        run: npm run lint
      - name: Форматтер (Prettier)
        run: npm run format:check
      - name: Тесты компонентов
        run: npm test
      - name: Проверка типов и сборка
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образов
        run: |
          cp .env.example .env
          docker compose build
